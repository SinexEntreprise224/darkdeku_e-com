{% extends "base.html" %}

{% block title %}Modifier Marque — {{ make.name }}{% endblock %}

{% block content %}

<style>
    .edit-make-container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 5rem 1rem;
    }

    .edit-make-card {
        background: #16161A;
        border: 1px solid rgba(201, 168, 76, 0.1);
        border-radius: 24px;
        padding: 3.5rem;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    }

    .edit-make-card h1 {
        font-family: 'Cormorant Garamond', serif;
        font-size: 2.5rem;
        color: #F0EDE6;
        text-align: center;
        margin-bottom: 0.5rem;
    }

    .edit-make-subtitle {
        text-align: center;
        color: #C9A84C;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        margin-bottom: 3rem;
        display: block;
    }

    /* —— Stylisation du Formulaire —— */
    .edit-make-card p {
        margin-bottom: 1.8rem;
    }

    .edit-make-card label {
        display: block;
        color: #7A7875;
        font-size: 0.8rem;
        font-weight: 700;
        margin-bottom: 0.6rem;
        text-transform: uppercase;
    }

    .edit-make-card input {
        width: 100%;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 1rem;
        color: #F0EDE6;
        outline: none;
        transition: 0.3s;
    }

    .edit-make-card input:focus {
        border-color: #C9A84C;
        background: rgba(201, 168, 76, 0.04);
    }

    /* —— Bouton Update —— */
    .btn-update-make {
        width: 100%;
        background: transparent;
        color: #F0EDE6;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 1.1rem;
        border-radius: 14px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 1rem;
    }

    .btn-update-make:hover {
        background: #F0EDE6;
        color: #0E0E10;
        transform: translateY(-3px);
    }

    .cancel-link {
        display: block;
        text-align: center;
        margin-top: 2rem;
        color: #7A7875;
        text-decoration: none;
        font-size: 0.85rem;
    }

    .cancel-link:hover {
        color: #C9A84C;
    }
</style>

<div class="edit-make-container">
    <div class="edit-make-card">
        <h1>Modification</h1>
        <span class="edit-make-subtitle">Partenaire : {{ make.name }}</span>

        <form method="POST">
            {% csrf_token %}
            
            <div class="form-body">
                {{ form.as_p }}
            </div>

            <button type="submit" class="btn-update-make">
                Sauvegarder les modifications
            </button>
        </form>

        <a href="{% url 'admin_index' %}" class="cancel-link">
             Annuler et revenir au panel
        </a>
    </div>
</div>

{% endblock %}
