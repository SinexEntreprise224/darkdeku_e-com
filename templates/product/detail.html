{% extends "base.html" %}
{% block title %}{{ product.name }} | DarkDeku{% endblock %}
{% block content %}

<div class="container detail-container">
    <div id="details-dynamic-container"
         hx-get="{% url 'load_details' product.slug %}"
         hx-trigger="every 30s"
         hx-swap="innerHTML">
        {% include "loaders/details.html" %}
    </div>
</div>

<style>
  /* ── Variables locales ── */
  :root {
    --gold: #c9a84c;
    --gold-dim: #7a6230;
    --dark-bg: #090909;
    --text-main: #e8e0d0;
    --text-muted: #7a7875;
  }

  /* ── Page wrapper ── */
  .detail-container {
    padding: 2rem 1.5rem;
    background: var(--dark-bg);
    min-height: 90vh;
    font-family: 'Nunito Sans', sans-serif;
  }
  .detail-wrap {
    padding: 1rem 0 5rem;
    max-width: 1100px;
    margin: 0 auto;
  }

  /* ── Breadcrumb ── */
  .breadcrumb-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 2rem;
    font-size: 0.78rem;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  .breadcrumb-row a { color: var(--text-muted); text-decoration: none; transition: .2s; }
  .breadcrumb-row a:hover { color: var(--gold); }
  .breadcrumb-row .current { color: rgba(232,224,208,.6); }

  /* ── Not found ── */
  .not-found {
    text-align: center;
    padding: 6rem 2rem;
    color: var(--text-muted);
  }
  .not-found i { font-size: 3rem; color: var(--gold-dim); display: block; margin-bottom: 1rem; }

  /* ── Layout ── */
  .product-layout {
    display: grid;
    grid-template-columns: 1fr 1.15fr;
    background: #16161a;
    border: 1px solid rgba(201,168,76,0.18);
    border-radius: 24px;
    overflow: hidden;
    animation: fadeUp .45s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Gallery ── */
  .product-gallery {
    position: relative;
    background: #111114;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 500px;
    overflow: hidden;
    border-right: 1px solid rgba(201,168,76,0.1);
  }
  .product-gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: .6s cubic-bezier(.22,.68,0,1.2);
  }
  .product-gallery:hover img { transform: scale(1.05); }
  .gallery-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .75rem;
    color: rgba(201,168,76,0.2);
    font-size: 3rem;
  }
  .gallery-placeholder span { font-size: .85rem; font-family: 'Nunito Sans', sans-serif; }

  /* ── Gallery badges ── */
  .gallery-chip {
    position: absolute;
    top: 1.5rem; left: 1.5rem;
    padding: .4rem 1rem;
    background: rgba(14,14,16,0.8);
    border: 1px solid var(--gold);
    border-radius: 8px;
    font-size: .7rem;
    font-weight: 700;
    color: var(--gold);
    backdrop-filter: blur(8px);
    z-index: 2;
  }
  .gallery-stock {
    position: absolute;
    bottom: 1.5rem; left: 1.5rem;
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .4rem 1rem;
    border-radius: 8px;
    font-size: .75rem;
    font-weight: 700;
    backdrop-filter: blur(8px);
    z-index: 2;
  }
  .gallery-stock .stock-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    display: inline-block;
  }
  .gallery-stock.in  { background: rgba(15,110,86,0.8);  color: #7fffd4; }
  .gallery-stock.low { background: rgba(133,79,11,0.8);  color: #fac775; }
  .gallery-stock.out { background: rgba(90,20,20,0.8);   color: #f09595; }

  /* ── Info panel ── */
  .product-info {
    padding: 3rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  /* Category label */
  .category-label {
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gold);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-bottom: .25rem;
  }
  .category-label:hover { opacity: .8; }

  .info-top h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.8rem;
    color: #f0ede6;
    margin: .5rem 0 1rem;
    line-height: 1.1;
  }
  .price-row { display: flex; align-items: baseline; gap: 8px; }
  .price-main   { font-size: 2.2rem; font-weight: 700; color: var(--gold); font-family: 'Cormorant Garamond', serif; }
  .price-currency { font-size: .85rem; color: var(--gold-dim); }

  /* ── Divider ── */
  .info-divider { height: 1px; background: rgba(201,168,76,0.12); }

  /* ── Description ── */
  .desc-block { display: flex; flex-direction: column; gap: .75rem; }
  .desc-header { display: flex; align-items: center; }
  .desc-label {
    font-size: .68rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .desc-content {
    font-size: .95rem;
    color: #9a9794;
    line-height: 1.8;
    border-left: 2px solid rgba(201,168,76,0.3);
    padding-left: 1.2rem;
  }
  .desc-content p { margin: 0 0 .5rem; }
  .desc-collapsed {
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .desc-collapsed.expanded { -webkit-line-clamp: unset; }
  .btn-read-more {
    background: transparent;
    border: none;
    color: var(--gold-dim);
    font-size: .75rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0;
    transition: color .2s;
  }
  .btn-read-more:hover { color: var(--gold); }

  /* ── Specs ── */
  .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .spec-card {
    background: #0f0f11;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .spec-label {
    font-size: .65rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .spec-value { font-size: .9rem; color: var(--text-main); }
  .spec-value a { color: var(--gold); text-decoration: none; }
  .spec-value a:hover { opacity: .8; }

  /* ── CTA ── */
  .cta-group { display: flex; flex-direction: column; gap: 10px; margin-top: .5rem; }
  .btn-add-cart {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .8rem;
    padding: 1.2rem;
    background: var(--gold);
    border-radius: 12px;
    color: #0e0e10;
    font-weight: 800;
    text-transform: uppercase;
    text-decoration: none;
    font-size: .85rem;
    letter-spacing: 1.5px;
    transition: .2s;
    border: none;
    cursor: pointer;
  }
  .btn-add-cart:hover { background: #e8c97a; transform: translateY(-2px); }
  .btn-add-cart.disabled {
    background: #1a1a1a;
    color: #444;
    cursor: default;
    border: 1px solid #2a2a2a;
  }
  .btn-add-cart.disabled:hover { transform: none; background: #1a1a1a; }

  /* ── Tags ── */
  .tags-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-pill {
    font-size: .72rem;
    padding: 5px 12px;
    border: 1px solid rgba(201,168,76,0.25);
    color: var(--gold-dim);
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 3px;
    text-decoration: none;
    transition: .2s;
  }
  .tag-pill:hover { border-color: var(--gold); color: var(--gold); }

  /* ── Admin tools ── */
  .admin-tools {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem;
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .admin-label {
    font-size: .65rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
  }
  .btn-edit, .btn-del {
    font-size: .75rem;
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid;
    display: flex;
    align-items: center;
    gap: 5px;
    text-decoration: none;
    transition: .2s;
  }
  .btn-edit { border-color: #2a4a6b; color: #5da0d4; background: rgba(12,48,80,0.3); }
  .btn-edit:hover { background: #0c3050; }
  .btn-del { border-color: #6b1a1a; color: #eb5757; background: rgba(61,10,10,0.3); }
  .btn-del:hover { background: #3d0a0a; }

  /* ── Back link ── */
  .back-link {
    font-size: .78rem;
    color: var(--text-muted);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color .2s;
    margin-top: .5rem;
  }
  .back-link:hover { color: var(--gold); }

  /* ── Responsive ── */
  @media (max-width: 860px) {
    .product-layout { grid-template-columns: 1fr; border-radius: 16px; }
    .product-gallery { min-height: 350px; border-right: none; border-bottom: 1px solid rgba(201,168,76,0.1); }
    .product-info { padding: 2rem 1.5rem; }
    .info-top h1 { font-size: 2rem; }
    .price-main { font-size: 1.7rem; }
  }
  @media (max-width: 480px) {
    .detail-container { padding: 1rem; }
    .specs-grid { grid-template-columns: 1fr; }
    .info-top h1 { font-size: 1.6rem; }
  }
</style>

<script>
  function toggleDesc() {
    const text  = document.getElementById('descText');
    const icon  = document.getElementById('readMoreIcon');
    const label = document.getElementById('readMoreLabel');
    if (!text) return;
    const expanded = text.classList.toggle('expanded');
    icon.className   = expanded ? 'bi bi-chevron-up' : 'bi bi-chevron-down';
    label.textContent = expanded ? 'Réduire' : 'Lire plus';
  }

  /* Masquer le bouton si la description est courte */
  function checkDescHeight() {
    const el  = document.getElementById('descText');
    const btn = document.getElementById('readMoreBtn');
    if (el && btn && el.scrollHeight <= el.clientHeight + 5) {
      btn.style.display = 'none';
    }
  }

  document.addEventListener('DOMContentLoaded', checkDescHeight);

  document.body.addEventListener('htmx:afterSwap', function(evt) {
    if (evt.detail.target.id === 'details-dynamic-container') {
      checkDescHeight();
    }
  });
</script>

{% endblock %}
