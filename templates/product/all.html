{% extends "base.html" %}
{% block title %}Catalogue | DarkDeku{% endblock %}

{% block content %}
<section class="catalogue-section">
    <div class="container">

        <div class="catalogue-header">
            <div class="catalogue-title-block">
                <p class="eyebrow">Exclusivités DarkDeku</p>
                <h1>Catalogue Produits</h1>
            </div>
            
            {% if user.is_staff %}
                <a href="{% url 'admin_index' %}" class="btn-admin">
                    <i class="bi bi-sliders"></i> Gérer le stock
                </a>
            {% endif %}
        </div>

        <div id="product-container" 
             hx-get="{% url 'load_products' %}" 
             hx-trigger="load, every 20s"
             hx-swap="innerHTML transition:true">
            <div class="shimmer-wrapper">
                <p>Mise à jour de la collection...</p>
            </div>
        </div>

    </div>
</section>

<style>
    .catalogue-section { padding: 3rem 0; background: var(--dark-bg); }
    
    .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 1.5rem;
    }

    .catalogue-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 3.5rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
        gap: 1.5rem;
    }

    .eyebrow { 
        font-size: 0.75rem; 
        color: var(--gold); 
        text-transform: uppercase; 
        letter-spacing: 0.3em; 
        margin-bottom: 0.6rem;
        font-weight: 600;
    }

    .catalogue-title-block h1 {
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(2rem, 5vw, 3.2rem);
        margin: 0;
        color: var(--text-main);
    }

    .btn-admin {
        padding: 0.6rem 1.2rem;
        border: 1px solid var(--gold);
        border-radius: 8px;
        color: var(--gold);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .btn-admin:hover {
        background: var(--gold);
        color: var(--dark-bg);
    }

    .shimmer-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 400px;
        color: var(--text-muted);
        letter-spacing: 2px;
        text-transform: uppercase;
        font-size: 0.8rem;
    }
</style>
{% endblock %}
