{% extends "base.html" %}

{% block title %}Nouveau Produit — DarkDeku{% endblock %}

{% block content %}

<style>
    .product-form-container {
        padding: 5rem 1rem;
        display: flex;
        justify-content: center;
    }

    .product-card {
        background: #16161A;
        border: 1px solid rgba(201, 168, 76, 0.1);
        border-radius: 24px;
        padding: 3.5rem;
        width: 100%;
        max-width: 700px; /* Plus large pour les détails du produit */
        box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    }

    .product-card h1 {
        font-family: 'Cormorant Garamond', serif;
        font-size: 2.5rem;
        color: #F0EDE6;
        text-align: center;
        margin-bottom: 0.5rem;
    }

    .product-subtitle {
        text-align: center;
        color: #C9A84C;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        margin-bottom: 3rem;
        display: block;
    }

    /* —— Style des champs Django —— */
    .product-card p {
        margin-bottom: 1.8rem;
    }

    .product-card label {
        display: block;
        color: #C9A84C;
        font-size: 0.85rem;
        font-weight: 700;
        margin-bottom: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .product-card input, 
    .product-card select, 
    .product-card textarea {
        width: 100%;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 1rem;
        color: #F0EDE6;
        outline: none;
        transition: 0.3s;
    }

    .product-card textarea {
        min-height: 120px;
        resize: vertical;
    }

    .product-card input:focus, 
    .product-card select:focus, 
    .product-card textarea:focus {
        border-color: #C9A84C;
        background: rgba(201, 168, 76, 0.04);
        box-shadow: 0 0 15px rgba(201, 168, 76, 0.1);
    }

    /* —— Bouton de validation (Vert Création) —— */
    .btn-save-product {
        width: 100%;
        background: #2ed573;
        color: #0E0E10;
        border: none;
        padding: 1.2rem;
        border-radius: 14px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 1rem;
    }

    .btn-save-product:hover {
        background: #7bed9f;
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(46, 213, 115, 0.2);
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 2rem;
        color: #7A7875;
        text-decoration: none;
        font-size: 0.85rem;
        transition: 0.3s;
    }

    .back-link:hover {
        color: #F0EDE6;
    }
</style>

<div class="product-form-container">
    <div class="product-card">
        <h1>Inventaire</h1>
        <span class="product-subtitle">Ajouter un nouveau produit</span>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-body">
                {{ form.as_p }}
            </div>

            <button type="submit" class="btn-save-product">
                Inscrire au catalogue
            </button>
        </form>

        <a href="{% url 'admin_index' %}" class="back-link">
            <i class="bi bi-arrow-left"></i> Retour au panel d'administration
        </a>
    </div>
</div>

{% endblock %}
