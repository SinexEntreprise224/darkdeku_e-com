{% extends "base.html" %}
{% load crispy_forms_filters %}
{% load crispy_forms_tags %}

{% block title %}Modifier le profil — DarkDeku{% endblock %}

{% block content %}

<style>
    .edit-profile-container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 4rem 1rem;
    }

    .edit-card {
        background: #16161A;
        border: 1px solid rgba(201, 168, 76, 0.1);
        border-radius: 20px;
        padding: 3rem;
        width: 100%;
        max-width: 600px;
        box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .edit-card h1 {
        font-family: 'Cormorant Garamond', serif;
        font-size: 2.5rem;
        color: #F0EDE6;
        text-align: center;
        margin-bottom: 2rem;
    }

    /* —— Personnalisation Crispy Forms —— */
    .edit-card label {
        color: #C9A84C !important;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.8rem;
        letter-spacing: 0.05em;
        margin-bottom: 0.5rem;
    }

    .edit-card input, .edit-card select, .edit-card textarea {
        background: rgba(255, 255, 255, 0.03) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 10px !important;
        color: #F0EDE6 !important;
        padding: 0.8rem !important;
        transition: 0.3s !important;
    }

    .edit-card input:focus {
        border-color: #C9A84C !important;
        background: rgba(201, 168, 76, 0.05) !important;
        box-shadow: none !important;
    }

    /* —— Bouton Enregistrer —— */
    .btn-save {
        width: 100%;
        background: #C9A84C;
        color: #0E0E10;
        border: none;
        padding: 1rem;
        border-radius: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 1.5rem;
    }

    .btn-save:hover {
        background: #E8C97A;
        transform: translateY(-2px);
    }

    .cancel-link {
        display: block;
        text-align: center;
        margin-top: 1.5rem;
        color: #7A7875;
        text-decoration: none;
        font-size: 0.85rem;
    }

    .cancel-link:hover {
        color: #F0EDE6;
    }
    
    /* Correction pour les erreurs Crispy */
    .invalid-feedback {
        color: #ff4757 !important;
        font-size: 0.8rem;
    }
</style>

<div class="edit-profile-container">
    <div class="edit-card">
        <h1>Modifier le profil</h1>

        <form method="POST">
            {% csrf_token %}
            
            <div class="crispy-dark-theme">
                {{ form|crispy }}
            </div>

            <button type="submit" class="btn-save">
                Enregistrer les modifications
            </button>
        </form>

        <a href="{% url 'profile' %}" class="cancel-link">
            Annuler et revenir
        </a>
    </div>
</div>

{% endblock %}
